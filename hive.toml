default_protocol = "http"
http_addr = "0.0.0.0:3000"
# Set this to a private address to move the dashboard, /stats, /history, and
# /metrics off the public HTTP listener.
admin_addr = "127.0.0.1:6869"
udp_addr = "0.0.0.0:6969"
database_path = "hive.db"
announce_interval = 1800
peer_timeout = 3600
persistence_interval = 30
rate_limit_per_minute = 500
max_concurrent_http_requests = 128

# Below setting is for cloudflared tunnel. When
# both tunnel and hive are running on the same server.
trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128"]

# For Docker, supported trusted CIDR range is
# trusted_proxy_cidrs = ["172.20.0.0/16"]

# CAUTION: DO NOT ever set the seeting like this
# trusted_proxy_cidrs = ["0.0.0.0/0", "::/0"]
# This ould trust forwarding headers from every client
# and let attackers forge IP addresses to bypass rate limiting.

# Keep the below setting unless Hive is behind a reverse proxy whose 
# direct source address or network you know and trust. 
#trusted_proxy_cidrs = []
client_ip_header = "cf-connecting-ip"
log_filter = "hive_tracker=info"

# Set to false to disable only the HTTP /scrape endpoint.
enable_http_scrape = true

# Set to false to disable only the UDP scrape action.
enable_udp_scrape = false
