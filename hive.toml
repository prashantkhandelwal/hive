default_protocol = "http"
http_addr = "0.0.0.0:3000"
udp_addr = "0.0.0.0:6969"
database_path = "hive.db"
announce_interval = 1800
peer_timeout = 3600
persistence_interval = 30

rate_limit_per_minute = 5000

log_filter = "hive_tracker=debug"

# Set to false to disable only the HTTP /scrape endpoint.
enable_http_scrape = true

# Set to false to disable only the UDP scrape action.
enable_udp_scrape = false

