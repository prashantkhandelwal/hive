name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.2.3
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  HIVE_VERSION: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: hive-tracker
            archive: hive-tracker-linux-x86_64-gnu.tar.gz
            build_tool: cargo
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: hive-tracker
            archive: hive-tracker-linux-x86_64-musl.tar.gz
            build_tool: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: hive-tracker
            archive: hive-tracker-linux-aarch64-gnu.tar.gz
            build_tool: cross
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            binary: hive-tracker
            archive: hive-tracker-linux-armv7-gnu.tar.gz
            build_tool: cross
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: hive-tracker.exe
            archive: hive-tracker-x86_64-pc-windows-msvc.zip
            build_tool: cargo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
      - name: Install Rust target
        if: matrix.build_tool == 'cargo'
        run: rustup target add ${{ matrix.target }}
      - name: Install cross
        if: matrix.build_tool == 'cross'
        uses: taiki-e/install-action@cross
      - name: Build release binary
        run: ${{ matrix.build_tool }} build --release --locked --target ${{ matrix.target }}
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          Copy-Item README.md, hive.toml dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.archive }}"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" README.md hive.toml dist/package/
          tar -czf "dist/${{ matrix.archive }}" -C dist/package .
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum hive-tracker-* > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
