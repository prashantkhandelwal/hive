name: Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Use "latest" or an existing release version such as v1.2.3
        required: true
        default: latest
        type: string

concurrency:
  group: docker-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ "$REQUESTED_TAG" == "latest" ]]; then
            RELEASE_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
            IMAGE_TAG="latest"
          else
            RELEASE_TAG="$REQUESTED_TAG"
            if [[ "$RELEASE_TAG" != v* ]]; then
              RELEASE_TAG="v$RELEASE_TAG"
            fi
            IMAGE_TAG="${RELEASE_TAG#v}"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use semantic version format such as v1.2.3"
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: prashantkhandelwal/hive:${{ steps.release.outputs.image_tag }}
          build-args: |
            HIVE_VERSION=${{ steps.release.outputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
