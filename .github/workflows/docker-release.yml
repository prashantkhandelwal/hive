name: Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish, for example latest, test, or 1.2.3
        required: true
        default: latest
        type: string

concurrency:
  group: docker-release-${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve image tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            IMAGE_TAG="$REQUESTED_TAG"
          else
            IMAGE_TAG="${REQUESTED_TAG#v}"
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag: $IMAGE_TAG"
            exit 1
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Validate build context
        shell: bash
        run: |
          if [[ ! -f Dockerfile ]]; then
            echo "::error::The selected ref does not contain a Dockerfile"
            exit 1
          fi
          if [[ ! -f docker/hive.toml ]]; then
            echo "::error::The selected ref does not contain docker/hive.toml"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: prashantkhandelwal/hive:${{ steps.release.outputs.image_tag }}
          build-args: |
            HIVE_VERSION=${{ steps.release.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
